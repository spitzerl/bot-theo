version: '3.8'

services:
  theo-bot:
    container_name: theo-schneider-bot
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Renseignez vos clés soit dans l'éditeur de variables de Dockhand (.env),
      # soit directement ci-dessous si vous ne partagez pas votre fichier.
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=3000
      - NODE_ENV=production
    networks:
      - proxy
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
